<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img">
  <title>PR Flow, painel local do dia de trabalho</title>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151f"/>
      <stop offset="1" stop-color="#090c13"/>
    </linearGradient>
    <radialGradient id="banner-glow" cx="0.08" cy="0" r="0.6">
      <stop offset="0" stop-color="#f07832" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f07832" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="banner-window">
      <rect x="150" y="124" width="900" height="296" rx="16"/>
    </clipPath>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#banner-bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#banner-glow)"/>
  <rect x="150" y="32" width="900" height="4" rx="2" fill="#f07832"/>
  <text x="600" y="74" text-anchor="middle" fill="#e6e9f3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">PR Flow</text>
  <text x="600" y="100" text-anchor="middle" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">PRs &#183; Jira &#183; Journal &#183; Briefing</text>

  <g clip-path="url(#banner-window)">
    <rect x="150" y="124" width="900" height="296" fill="#121620"/>
    <rect x="150" y="124" width="188" height="296" fill="#0c1018"/>
    <rect x="338" y="124" width="1" height="296" fill="#353c4d"/>

    <rect x="168" y="142" width="26" height="26" rx="7" fill="#f07832"/>
    <text x="181" y="159" text-anchor="middle" fill="#1a0e06" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">PR</text>
    <text x="202" y="160" fill="#e6e9f3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">painel</text>
    <rect x="166" y="180" width="156" height="1" fill="#353c4d"/>

    <rect x="166" y="196" width="156" height="28" rx="8" fill="#f07832" fill-opacity="0.14" stroke="#f07832" stroke-opacity="0.42"/>
    <text x="180" y="215" fill="#ff9a5c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Dashboard</text>
    <text x="180" y="251" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Tasks</text>
    <text x="180" y="283" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Jira</text>
    <text x="180" y="315" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Journal</text>
    <text x="180" y="347" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Resumos</text>
    <text x="180" y="379" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Pull Requests</text>

    <rect x="362" y="144" width="664" height="92" rx="12" fill="#0f131b" stroke="#353c4d"/>
    <text x="380" y="168" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="0.8">BRIEFING</text>
    <text x="380" y="192" fill="#e6e9f3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Mapa do dia</text>
    <rect x="380" y="206" width="420" height="8" rx="4" fill="#353c4d"/>
    <rect x="380" y="220" width="280" height="8" rx="4" fill="#2a3142"/>

    <rect x="362" y="250" width="210" height="58" rx="12" fill="#0f131b" stroke="#353c4d"/>
    <text x="378" y="272" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Streak</text>
    <text x="378" y="294" fill="#ff9a5c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">6 dias</text>

    <rect x="586" y="250" width="210" height="58" rx="12" fill="#0f131b" stroke="#353c4d"/>
    <text x="602" y="272" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">F&#233;rias</text>
    <text x="602" y="294" fill="#ff9a5c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">18 dias</text>

    <rect x="810" y="250" width="216" height="58" rx="12" fill="#0f131b" stroke="#353c4d"/>
    <text x="826" y="272" fill="#a6b0ce" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Agenda</text>
    <text x="826" y="294" fill="#ff9a5c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">3 hoje</text>

    <rect x="362" y="322" width="664" height="36" rx="8" fill="#0f131b"/>
    <rect x="362" y="322" width="3" height="36" fill="#2ecf78"/>
    <text x="378" y="345" fill="#e6e9f3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">filtro de reviewers</text>
    <rect x="900" y="332" width="72" height="18" rx="5" fill="#2ecf78" fill-opacity="0.1" stroke="#2ecf78" stroke-opacity="0.22"/>
    <text x="936" y="345" text-anchor="middle" fill="#86efac" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Aprovada</text>

    <rect x="362" y="364" width="664" height="36" rx="8" fill="#0f131b"/>
    <rect x="362" y="364" width="3" height="36" fill="#fbbf24"/>
    <text x="378" y="387" fill="#e6e9f3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">sync do cache Jira</text>
    <rect x="900" y="374" width="72" height="18" rx="5" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.22"/>
    <text x="936" y="387" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Pendente</text>
  </g>
  <rect x="150" y="124" width="900" height="296" rx="16" fill="none" stroke="#353c4d"/>
</svg>
